<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول | سلسلة الطيف</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
  <div class="logo">سلسلة الطيف</div>
  
  <button class="menu-toggle" id="menu-toggle">☰</button>
  
  <nav id="nav-menu">
    <a href="index.html">الرئيسية</a>
    <a href="index.html#courses">الدورات</a>
    <a href="login.html">تسجيل الدخول</a>
  </nav>
</header>

  <!-- نموذج تسجيل الدخول -->
  <section class="login-section">
    <div class="login-container">
      <h1>مرحباً بعودتك 👋</h1>
      <p>سجّل دخولك لمتابعة دوراتك التعليمية</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn login-btn">تسجيل الدخول</button>

        <!-- رسالة تظهر عند حدوث خطأ أو نجاح -->
        <p id="message" class="message"></p>
      </form>

      <p class="signup-link">ليس لديك حساب؟ <a href="signup.html">أنشئ حساباً جديداً</a></p>
    </div>
  </section>
  <!-- التذييل -->
  <footer class="footer">
    <p>© 2026 منصة سلسلة الطيف. جميع الحقوق محفوظة.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
