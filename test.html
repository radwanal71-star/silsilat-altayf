<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f9f9f9;
    }
    h1 {
      color: #1e293b;
    }
    .test-button {
      display: block;
      background-color: #38bdf8;
      color: #fff;
      padding: 20px;
      margin: 30px auto;
      border-radius: 8px;
      text-decoration: none;
      font-size: 24px;
      max-width: 300px;
    }
    /* هذا هو الاختبار: اخفاء الزر على الشاشات الصغيرة */
    @media (max-width: 768px) {
      .test-button {
        display: none;
      }
    }
  </style>
</head>
<body>
  <h1>اختبار @media</h1>
  <p>هذا الزر سيظهر فقط على الشاشات الكبيرة (أكبر من 768 بكسل).</p>
  <p>على الهاتف، يجب أن يختفي تماماً.</p>
  
  <a href="#" class="test-button">أنا زر الاختبار</a>
  
  <p>إذا اختفى الزر على هاتفك، فهذا يعني أن @media تعمل بشكل مثالي.</p>
</body>
</html>
