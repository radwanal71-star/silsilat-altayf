<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة الـ API مع البحث</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; padding: 20px; text-align: center; }
        
        #search-input {
            padding: 10px 15px;
            width: 80%;
            max-width: 400px;
            border: 2px solid #bdc3c7;
            border-radius: 25px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }
        #search-input:focus { border-color: #3498db; }

        #users-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .user-card {
            background: white; border-radius: 10px; padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 250px; text-align: right;
        }
        .user-card h3 { margin-top: 0; color: #2c3e50; }
        .user-card p { margin: 5px 0; color: #555; font-size: 14px;}
    </style>
</head>
<body>
    <h1>قائمة المستخدمين (من API خارجي)</h1>
    
    <input type="text" id="search-input" placeholder="ابحث عن مستخدم بالاسم...">

    <div id="users-container">
        <p>جارٍ تحميل البيانات... ⏳</p>
    </div>

    <script>
        const container = document.getElementById('users-container');
        const searchInput = document.getElementById('search-input');
        let allUsers = [];

        async function fetchUsers() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                if (!response.ok) throw new Error('فشل الاتصال');
                
                allUsers = await response.json();
                displayUsers(allUsers); // عرض الكل عند البداية

            } catch (error) {
                container.innerHTML = `<p style="color: red; font-weight: bold;">حدث خطأ: ${error.message}</p>`;
                console.error(error);
            }
        }

        function displayUsers(usersToDisplay) {
            container.innerHTML = ''; // تفريغ الحاوية

            if (usersToDisplay.length === 0) {
                container.innerHTML = '<p>لا توجد نتائج مطابقة للبحث.</p>';
                return;
            }

            usersToDisplay.forEach(user => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <h3>👤 ${user.name}</h3>
                    <p>📧 <strong>البريد:</strong> ${user.email}</p>
                    <p>📍 <strong>المدينة:</strong> ${user.address.city}</p>
                    <p>📞 <strong>الهاتف:</strong> ${user.phone}</p>
                `;
                container.appendChild(card);
            });
        }

        // مستمع الحدث للبحث
        searchInput.addEventListener('input', (event) => {
            const searchTerm = event.target.value.toLowerCase();
            
            // تصفية المصفوفة
            const filteredUsers = allUsers.filter(user => 
                user.name.toLowerCase().includes(searchTerm)
            );
            
            // عرض النتائج
            displayUsers(filteredUsers);
        });

        // تشغيل الدالة
        fetchUsers();
    </script>
</body>
</html>
