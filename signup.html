<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إنشاء حساب جديد | سلسلة الطيف</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">سلسلة الطيف</div>
  
  <button class="menu-toggle" id="menu-toggle">☰</button>
  
  <nav id="nav-menu">
    <a href="index.html">الرئيسية</a>
    <a href="index.html#courses">الدورات</a>
    <a href="login.html">تسجيل الدخول</a>
  </nav>
</header>

  <!-- نموذج إنشاء حساب -->
  <section class="login-section">
    <div class="login-container">
      <h1>انضم إلينا 🎉</h1>
      <p>أنشئ حسابك لمتابعة الدورات التعليمية</p>

      <form id="signup-form">
        <div class="form-group">
          <label for="name">الاسم الكامل</label>
          <input type="text" id="name" placeholder="أدخل اسمك الكامل" required>
        </div>

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="confirm-password">تأكيد كلمة المرور</label>
          <input type="password" id="confirm-password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn login-btn">إنشاء الحساب</button>
        <p id="message" class="message"></p>
      </form>

      <p class="signup-link">لديك حساب بالفعل؟ <a href="login.html">سجّل دخولك</a></p>
    </div>
  </section>

  <!-- التذييل -->
  <footer class="footer">
    <p>© 2026 منصة سلسلة الطيف. جميع الحقوق محفوظة.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
